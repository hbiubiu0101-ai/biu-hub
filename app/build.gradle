plugins { id 'com.android.application' }
def operatorName = providers.gradleProperty('youpOperatorName').orElse('').get()
def supportEmail = providers.gradleProperty('youpSupportEmail').orElse('').get()
def resourceText = { value -> '"' + value.replace("\\", "\\\\").replace("\"", "\\\"").replace("'", "\\'") + '"' }
android {
 namespace 'com.biu.next'; compileSdk 35
 defaultConfig { applicationId 'com.biu.next'; minSdk 26; targetSdk 35; versionCode 560; versionName '5.0.59'; resValue 'bool', 'youp_require_activation', 'true'; resValue 'string', 'youp_update_url', '';
 resValue 'string', 'youp_operator_name', resourceText(operatorName);
 resValue 'string', 'youp_support_email', resourceText(supportEmail); testInstrumentationRunner 'com.biu.next.SmokeTest' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   maxHeapSize = '1g'
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
   }
  }
 }
 // Compress the bundled OCR libraries so the universal APK fits the in-app update limit.
 packagingOptions { jniLibs { useLegacyPackaging true } }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
