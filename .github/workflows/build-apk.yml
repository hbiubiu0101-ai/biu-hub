name: Build NEXT APK
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 构建签名离线正式版（不部署后台、不联网发布）
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: youp-offline-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_SIGNED: ${{ github.ref_type == 'tag' || inputs.publish_update }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        shell: bash
        run: |
          if [ -f NEXT/settings.gradle ]; then
            echo "PROJECT_DIR=NEXT" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::未找到 Android 工程"
            exit 1
          fi
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Check open offline behavior
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          gradle -p "$PROJECT_DIR" testDebugUnitTest --tests com.biu.next.OpenOfflineEditionTest --tests com.biu.next.EngineTest --tests com.biu.next.OfflineLicensePolicyTest --tests com.biu.next.OfflineActivationTest --no-daemon
      - name: Build debug preview
        if: env.BUILD_SIGNED != 'true'
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
          mkdir -p apk-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk-output/Youp-5.0.59-test.apk
      - name: Build signed offline APK
        if: env.BUILD_SIGNED == 'true'
        env:
          SIGNING_KEY_B64: ${{ secrets.YOUP_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.YOUP_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.YOUP_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.YOUP_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY_B64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" ]]; then
            echo "::error::请保留原来的签名密钥和密码配置，才能覆盖安装"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/youp-key.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$keystore"
          mkdir -p apk-output
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/youp-aligned.apk"
          sign_apk() {
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_STORE_PASSWORD --key-pass "env:$1" \
              --out apk-output/Youp-5.0.59.apk "$RUNNER_TEMP/youp-aligned.apk"
          }
          signing_log="$RUNNER_TEMP/youp-signing.log"
          if ! sign_apk SIGNING_STORE_PASSWORD 2>"$signing_log"; then
            if grep -q 'UnrecoverableKeyException' "$signing_log" &&
               [[ -n "$SIGNING_KEY_PASSWORD" && "$SIGNING_KEY_PASSWORD" != "$SIGNING_STORE_PASSWORD" ]]; then
              sign_apk SIGNING_KEY_PASSWORD
            else
              cat "$signing_log" >&2
              exit 1
            fi
          fi
          "$tools/apksigner" verify --verbose apk-output/Youp-5.0.59.apk
      - name: Check offline permissions
        shell: bash
        run: |
          for apk in apk-output/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
            if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|REQUEST_INSTALL_PACKAGES)" "$RUNNER_TEMP/permissions.txt"; then
              echo "::error::APK 含联网或安装其他应用的权限，已停止交付"
              exit 1
            fi
          done
          printf '离线版 5.0.59：免费试用3天、本地验证码永久激活，无联网权限。请下载 NEXT-APK 产物并安装。\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
