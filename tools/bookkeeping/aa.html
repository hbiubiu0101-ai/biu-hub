<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AA记账 · 好友分摊记一笔</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B6B53'/%3E%3Ccircle cx='12' cy='12' r='4' fill='none' stroke='%23F7F5EF' stroke-width='2.4'/%3E%3Ccircle cx='21' cy='12' r='4' fill='none' stroke='%23F7F5EF' stroke-width='2.4'/%3E%3Cpath d='M7 22c0-3 2.2-4.5 5-4.5s5 1.5 5 4.5M17 17.5c2.8 0 5 1.5 5 4.5' stroke='%23F7F5EF' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#F6F4EE;--panel:#FFFFFF;--line:#E4E0D4;--line-strong:#D5CFBF;
  --ink:#262B27;--ink-2:#5C645E;--ink-3:#9AA19A;
  --jade:#1B6B53;--jade-deep:#13503E;--jade-soft:#E3EFEA;
  --amber:#C96F2B;--amber-soft:#F7EADC;
  --red:#B4482E;--red-soft:#F6E4DE;
  --blue:#3E6E8F;--blue-soft:#E4EDF3;
  --purple:#8A5A9E;--purple-soft:#EFE7F4;
  --radius:8px;--shadow:0 1px 2px rgba(38,43,39,.05),0 6px 18px rgba(38,43,39,.06);
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(to bottom,transparent 31px,var(--line) 31px,var(--line) 32px,transparent 32px);background-size:100% 32px;opacity:.28}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px 24px 48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 2px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--jade);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand h1{font-size:19px;font-weight:900}
.brand p{font-size:12px;color:var(--ink-2);margin-top:1px}
.group-tabs{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;overflow-x:auto;max-width:100%}
.group-tab{border:0;background:transparent;padding:7px 15px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-weight:500;white-space:nowrap}
.group-tab.active{background:var(--jade);color:#fff;font-weight:700}
.group-tab:hover:not(.active){background:var(--jade-soft);color:var(--jade-deep)}
.group-add{border:1px dashed var(--line-strong);background:transparent;border-radius:7px;width:32px;height:32px;cursor:pointer;color:var(--ink-3);font-size:17px;line-height:1;flex:none;font-family:inherit}
.group-add:hover{border-color:var(--jade);color:var(--jade)}

/* ============ 布局 ============ */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}

/* ============ KPI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.jade::before{background:var(--jade)}
.kpi.blue::before{background:var(--blue)}
.kpi.amber::before{background:var(--amber)}
.kpi.red::before{background:var(--red)}
.kpi .k-label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .k-label svg{width:14px;height:14px;color:var(--ink-3)}
.kpi .k-value{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.01em}
.kpi .k-value small{font-size:14px;font-weight:700;color:var(--ink-3);margin-left:3px}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:5px}
.kpi .k-sub b{font-weight:700}
.kpi .k-sub .pos{color:var(--jade)}
.kpi .k-sub .neg{color:var(--red)}

/* ============ 面板 ============ */
.main-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-head h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--jade)}
.panel-head .hint{font-size:12px;color:var(--ink-3)}
.panel-body{padding:18px}
.chart-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.chart-box{min-height:300px}

/* ============ 明细表 ============ */
.ledger{width:100%;border-collapse:collapse;table-layout:fixed}
.ledger colgroup col:nth-child(1){width:11%}
.ledger colgroup col:nth-child(2){width:13%}
.ledger colgroup col:nth-child(3){width:24%}
.ledger colgroup col:nth-child(4){width:30%}
.ledger colgroup col:nth-child(5){width:12%}
.ledger colgroup col:nth-child(6){width:10%}
.ledger th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line-strong);background:var(--paper)}
.ledger td{padding:10px 12px;border-bottom:1px dashed var(--line);font-size:13px;vertical-align:middle}
.ledger tr:last-child td{border-bottom:0}
.ledger .amt{font-weight:700;text-align:right}
.ledger .note{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger .date{color:var(--ink-3);font-size:12px}
.member-chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11.5px;color:var(--ink-2);margin:1px}
.member-chip i{width:6px;height:6px;border-radius:50%;flex:none}
.ledger .del-btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:24px;height:24px;cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1;display:grid;place-items:center}
.ledger .del-btn:hover{border-color:var(--red);color:var(--red)}
.ledger-empty{text-align:center;padding:38px 0;color:var(--ink-3);font-size:13px}

/* ============ 侧栏 ============ */
.side-col{display:flex;flex-direction:column;gap:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select{border:1px solid var(--line-strong);border-radius:6px;padding:9px 11px;font-size:14px;font-family:inherit;background:#FCFBF7;color:var(--ink);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--jade);background:#fff;box-shadow:0 0 0 3px rgba(27,107,83,.12)}
.field input.num{text-align:right}
.parts-picker{display:flex;flex-wrap:wrap;gap:6px}
.part-chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.part-chip i{width:7px;height:7px;border-radius:50%;flex:none}
.part-chip.active{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep);font-weight:700}
.save-btn{grid-column:1/-1;border:0;border-radius:7px;background:var(--jade);color:#fff;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:2px}
.save-btn:hover{background:var(--jade-deep)}
.save-btn:active{transform:translateY(1px)}
.split-tip{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}

/* 成员管理 */
.member-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px dashed var(--line)}
.member-row:last-child{border-bottom:0}
.m-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.m-name{font-size:13.5px;font-weight:700;flex:1}
.m-name .me{font-size:10.5px;background:var(--jade-soft);color:var(--jade-deep);border-radius:4px;padding:1px 6px;margin-left:5px;font-weight:700}
.m-num{font-size:12px;color:var(--ink-3)}
.m-del{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:24px;height:24px;cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1;font-family:inherit}
.m-del:hover{border-color:var(--red);color:var(--red)}
.m-add{display:flex;gap:8px;padding:12px 16px}
.m-add input{flex:1;border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:#FCFBF7;outline:none}
.m-add input:focus{border-color:var(--jade)}
.m-add button{border:0;background:var(--ink);color:#fff;border-radius:6px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.m-add button:hover{background:#111}

/* 结算 */
.settle-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px dashed var(--line)}
.settle-row:last-child{border-bottom:0}
.settle-row .s-info{flex:1;min-width:0}
.settle-row .s-name{font-size:13px;font-weight:700}
.settle-row .s-detail{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.settle-row .s-net{font-size:15px;font-weight:900}
.settle-row .s-net.pos{color:var(--jade)}
.settle-row .s-net.neg{color:var(--red)}
.settle-bar{height:5px;background:#EFECE3;border-radius:3px;overflow:hidden;margin-top:5px}
.settle-bar i{display:block;height:100%;border-radius:3px}
.transfer{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px dashed var(--line)}
.transfer:last-child{border-bottom:0}
.transfer .t-arrow{color:var(--ink-3);flex:none}
.transfer .t-amt{font-size:14px;font-weight:900;color:var(--jade);margin-left:auto}
.transfer .t-note{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.transfer .t-users{font-size:12.5px;color:var(--ink)}
.balanced{text-align:center;padding:20px 0;color:var(--ink-3);font-size:13px}

/* 智能识别 */
.ai-input{width:100%;min-height:78px;resize:vertical;border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;background:#FCFBF7;color:var(--ink);outline:none}
.ai-input:focus{border-color:var(--jade);background:#fff;box-shadow:0 0 0 3px rgba(27,107,83,.12)}
.ai-row{display:flex;gap:8px;margin-top:9px;align-items:stretch}
.ocr-zone{flex:1;border:1px dashed var(--line-strong);border-radius:8px;background:#FCFBF7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px;cursor:pointer;text-align:center;color:var(--ink-3);font-size:11.5px;min-height:62px}
.ocr-zone:hover,.ocr-zone.drag{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep)}
.ocr-zone svg{width:18px;height:18px}
.ai-btn{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.ai-btn:hover{background:#111}
.ai-status{display:none;margin-top:9px;font-size:12px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.ai-status .spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--jade-soft);border-top-color:var(--jade);border-radius:50%;margin-right:7px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-preview{display:none;margin-top:9px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.ai-preview img{max-height:56px;border:1px solid var(--line);border-radius:6px}
.ai-preview .x-btn{border:0;background:var(--paper);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;cursor:pointer;color:var(--ink-3);font-size:12px;line-height:1}
.ai-preview .x-btn:hover{border-color:var(--red);color:var(--red)}
.ai-ok{font-size:12px;color:var(--jade-deep);background:var(--jade-soft);border-radius:6px;padding:7px 10px;margin-top:9px;display:none}
.ai-ok b{font-weight:700}

/* 群组洞察 */
.insight{display:flex;gap:11px;padding:12px 16px;border-bottom:1px dashed var(--line)}
.insight:last-child{border-bottom:0}
.insight .i-ico{flex:none;width:29px;height:29px;border-radius:7px;display:grid;place-items:center}
.insight .i-ico svg{width:15px;height:15px}
.insight .i-ico.up{background:var(--red-soft);color:var(--red)}
.insight .i-ico.tip{background:var(--amber-soft);color:var(--amber)}
.insight .i-ico.idea{background:var(--jade-soft);color:var(--jade)}
.insight .i-ico.team{background:var(--blue-soft);color:var(--blue)}
.insight .i-text{font-size:12.5px;color:var(--ink)}
.insight .i-text b{color:var(--ink);font-weight:700}
.insight .i-text .muted{color:var(--ink-3);font-size:11.5px;margin-top:2px}

/* ============ 响应式 ============ */
@media (max-width:1080px){.shell{grid-template-columns:minmax(0,1fr)}.side-col{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:820px){.app{padding:14px 14px 40px}.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}.side-col{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
@media (max-width:520px){.kpi-grid{grid-template-columns:1fr 1fr;gap:10px}.kpi .k-value{font-size:21px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.save-btn{grid-column:auto}.ledger .note{display:none}.ledger colgroup col:nth-child(4){width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style id="biu-aa-header-mobile-safe">
.biu-tool-entry{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;
  border:1px solid var(--line,#E4E0D4);border-radius:7px;background:#fff;
  color:var(--ink,#262B27);text-decoration:none;font-size:13px;font-weight:700;
  white-space:nowrap;flex:none;
}
.biu-tool-entry:hover{border-color:var(--jade,#1B6B53);background:var(--jade-soft,#E3EFEA);color:var(--jade-deep,#13503E)}
.biu-tool-entry svg{width:15px;height:15px;flex:none}
@media(max-width:700px){
  .topbar{gap:10px!important}
  .brand{width:100%!important;min-width:0!important;flex-wrap:wrap!important;gap:8px!important}
  .brand>div{min-width:0}
  .brand h1{white-space:nowrap!important}
  .biu-tool-entry{height:34px;padding:0 10px;font-size:12px}
  .top-actions{width:100%!important;justify-content:flex-end!important}
}
</style>














<style id="biu-aa-bottom-two-column">
/* AA 底部独立两列：左结算方案，右群组洞察 */
.aa-bottom-grid{
  display:grid;
  grid-template-columns:minmax(0,2.45fr) minmax(300px,1fr);
  gap:18px;
  margin-top:18px;
  align-items:stretch;
}
.aa-bottom-grid > div,
.aa-bottom-grid .panel{min-width:0}
.aa-bottom-grid .panel{
  height:100%;
  margin:0;
}
@media(max-width:1080px){
  .aa-bottom-grid{grid-template-columns:1fr}
  .aa-bottom-grid .panel{height:auto}
}
</style>


<style id="biu-aa-ledger-member-bottom-align">
@media (min-width:1081px){
  /* 只修正群组流水底部：顶部不动，底部与右侧群组成员底部齐平 */
  .main-col > .panel:nth-child(2){
    height:677px !important;
    min-height:677px !important;
    max-height:677px !important;
    overflow:hidden !important;
  }
  .main-col > .panel:nth-child(2) .panel-body{
    height:calc(677px - 49px) !important;
    overflow-y:auto !important;
  }
}
@media(max-width:1080px){
  .main-col > .panel:nth-child(2){
    height:auto !important;min-height:0 !important;max-height:none !important;overflow:visible !important;
  }
  .main-col > .panel:nth-child(2) .panel-body{
    height:auto !important;overflow:visible !important;
  }
}
</style>


























<style id="biu-aa-consumer-scroll-framework">
/* AA群组流水直接沿用消费智记的“卡片 + 内部滚动”框架 */
.main-col > .panel:has(.ledger-scroll){
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  overflow:hidden!important;
}
.main-col > .panel:has(.ledger-scroll) .ledger-scroll{
  display:block!important;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  overflow-x:auto!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch!important;
  touch-action:pan-x pan-y!important;
  box-sizing:border-box!important;
  scrollbar-width:auto!important;
  scrollbar-color:#9f988b #ece8df;
}
.main-col > .panel:has(.ledger-scroll) table.ledger{
  display:table!important;
  width:900px!important;
  min-width:900px!important;
  max-width:none!important;
  table-layout:fixed!important;
}
.main-col > .panel:has(.ledger-scroll) table.ledger thead{display:table-header-group!important}
.main-col > .panel:has(.ledger-scroll) table.ledger tbody{display:table-row-group!important}
.main-col > .panel:has(.ledger-scroll) table.ledger tr{display:table-row!important}
.main-col > .panel:has(.ledger-scroll) table.ledger th,
.main-col > .panel:has(.ledger-scroll) table.ledger td{display:table-cell!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(1){width:110px!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(2){width:240px!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(3){width:150px!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(4){width:190px!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(5){width:130px!important}
.main-col > .panel:has(.ledger-scroll) .ledger col:nth-child(6){width:80px!important}
.main-col > .panel:has(.ledger-scroll) .ledger th,
.main-col > .panel:has(.ledger-scroll) .ledger td{
  padding-left:14px!important;
  padding-right:14px!important;
}
.main-col > .panel:has(.ledger-scroll) .parts-line{
  display:flex!important;
  gap:8px!important;
  align-items:center!important;
  flex-wrap:nowrap!important;
  margin-bottom:5px!important;
}
.main-col > .panel:has(.ledger-scroll) .parts-line:last-child{margin-bottom:0!important}
.main-col > .panel:has(.ledger-scroll) .datetime-cell{white-space:nowrap!important}
.main-col > .panel:has(.ledger-scroll) .del-btn{
  position:static!important;
  margin:0 auto!important;
}
.main-col > .panel:has(.ledger-scroll) .ledger-scroll::-webkit-scrollbar{
  width:14px!important;
  height:16px!important;
}
.main-col > .panel:has(.ledger-scroll) .ledger-scroll::-webkit-scrollbar-track{
  background:#ece8df!important;
  border-radius:10px!important;
}
.main-col > .panel:has(.ledger-scroll) .ledger-scroll::-webkit-scrollbar-thumb{
  background:#9f988b!important;
  border-radius:10px!important;
  border:3px solid #ece8df!important;
}

@media(max-width:700px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
  .main-col{width:100%!important;max-width:100%!important;min-width:0!important}
  .main-col > .panel:has(.ledger-scroll){
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    overflow:hidden!important;
  }
  .main-col > .panel:has(.ledger-scroll) .ledger-scroll{
    width:100%!important;
    max-width:100%!important;

/* ============ 数据模型：群组 + 成员 + 记录 ============ */
const ME = "我";

const SUPABASE_KEY = "sb_publishable_0odHAoSGf6PA4gqIVfVwZQ_WuIVRRBy";
const API_HEADERS = {

};
const DATA = {"我的AA群组":{members:[ME],records:[]}};
const GROUP_IDS = {};
let cloudReady = false;

async function api(path, options={}){
  const url=SUPABASE_URL+"/rest/v1/"+path;
  let res;
  try{
    res=await fetch(url,{...options,headers:{...API_HEADERS,...(options.headers||{})}});
  }catch(e){
    throw new Error("网络请求失败："+(e.message||e));
  }
  const txt=await res.text();
  if(!res.ok){
    let msg=txt;
    try{
      const j=JSON.parse(txt);
      msg=[j.code,j.message,j.details,j.hint].filter(Boolean).join(" · ");
    }catch(_){}
    throw new Error("HTTP "+res.status+" · "+(msg||"Supabase 请求失败"));
  }
  if(!txt) return null;
  try{return JSON.parse(txt)}catch(_){return txt}
}
function makeClientId(){
  return (crypto.randomUUID ? crypto.randomUUID() : ("aa-"+Date.now()+"-"+Math.random().toString(16).slice(2)));
}
async function loadCloud(){
  let gs, rs;
  try{
    gs=await api("aa_groups?select=id,group_name,members,updated_at&order=id.asc");
  }catch(e){
    console.error("aa_groups load:",e);
    showCloudError("群组读取失败",e);
    return;
  }
  try{
    rs=await api("aa_records?select=id,client_id,group_id,amount,payer,participants,note,payment,expense_date,expense_time,updated_at&order=expense_date.desc,updated_at.desc");
  }catch(e){
    console.error("aa_records load:",e);
    showCloudError("流水读取失败",e);
    return;
  }

  try{
    if(!Array.isArray(gs)) gs=[];
    if(!Array.isArray(rs)) rs=[];

    // 首次使用：创建默认群组。创建失败时保留本地最低可用状态。
    if(gs.length===0){
      try{
        const created=await api("aa_groups",{
          method:"POST",
          headers:{"Prefer":"return=representation"},
          body:JSON.stringify({group_name:"我的AA群组",members:[ME],updated_at:new Date().toISOString()})
        });
        if(Array.isArray(created)&&created[0]) gs=[created[0]];
      }catch(e){
        console.error("bootstrap group:",e);
        if(!Object.keys(DATA).length){
          DATA["我的AA群组"]={members:[ME],records:[]};
          state.group="我的AA群组";
        }
        renderAll();
        showCloudError("默认群组创建失败",e);
        return;
      }
    }

    const nextData={}, nextIds={};
    gs.forEach(g=>{
      const name=(g.group_name||"").trim();
      if(!name) return;
      let mem=Array.isArray(g.members)?g.members.filter(Boolean):[];
      if(!mem.includes(ME)) mem=[ME,...mem];
      if(!mem.length) mem=[ME];
      nextData[name]={members:[...new Set(mem)],records:[]};
      nextIds[name]=g.id;
    });

    const idToName={};
    Object.keys(nextIds).forEach(name=>idToName[String(nextIds[name])]=name);
    rs.forEach(r=>{
      const name=idToName[String(r.group_id)];
      if(!name||!nextData[name]) return;
      nextData[name].records.push({
        _id:r.id,client_id:r.client_id,date:r.expense_date||todayISO(),time:r.expense_time||"",
        payer:r.payer||ME,amount:Number(r.amount)||0,
        parts:Array.isArray(r.participants)&&r.participants.length?r.participants:[r.payer||ME],
        note:r.note||"",pay:r.payment||""
      });
    });

    // 只有完整读取成功后才替换页面数据，避免失败时把界面清空。
    Object.keys(DATA).forEach(k=>delete DATA[k]);
    Object.assign(DATA,nextData);
    Object.keys(GROUP_IDS).forEach(k=>delete GROUP_IDS[k]);
    Object.assign(GROUP_IDS,nextIds);

    if(!DATA[state.group]) state.group=Object.keys(DATA)[0]||"";
    cloudReady=true;
    clearCloudError();
    renderAll();
  }catch(e){
    console.error("cloud parse:",e);
    showCloudError("云端数据处理失败",e);
  }
}

function showCloudError(prefix,e){
  const msg=prefix+"："+(e&&e.message?e.message:String(e||"未知错误"));
  const btn=$("saveBtn");
  if(btn){
    btn.textContent=msg.length>58?msg.slice(0,58)+"…":msg;
    btn.style.background="var(--red)";
    btn.title=msg;
  }
}
function clearCloudError(){
  const btn=$("saveBtn");
  if(btn && /失败|HTTP|网络请求/.test(btn.textContent)){
    btn.textContent="保存这笔 AA 消费";
    btn.style.background="";
    btn.title="";
  }
}
async function ensureCurrentGroupId(){
  const name=(state.group||"我的AA群组").trim();
  if(GROUP_IDS[name]) return GROUP_IDS[name];

  const rows=await api("aa_groups?group_name=eq."+encodeURIComponent(name)+"&select=id,group_name,members&limit=1");
  if(Array.isArray(rows)&&rows[0]&&rows[0].id){
    GROUP_IDS[name]=rows[0].id;
    if(!DATA[name]){
      let mem=Array.isArray(rows[0].members)?rows[0].members.filter(Boolean):[];
      if(!mem.includes(ME)) mem=[ME,...mem];
      DATA[name]={members:mem.length?mem:[ME],records:[]};
    }
    return rows[0].id;
  }

  const created=await api("aa_groups",{
    method:"POST",
    headers:{"Prefer":"return=representation"},
    body:JSON.stringify({
      group_name:name,
      members:(DATA[name]&&DATA[name].members&&DATA[name].members.length)?DATA[name].members:[ME],
      updated_at:new Date().toISOString()
    })
  });
  if(!Array.isArray(created)||!created[0]||!created[0].id) throw new Error("无法取得群组ID");
  GROUP_IDS[name]=created[0].id;
  if(!DATA[name]) DATA[name]={members:[ME],records:[]};
  return created[0].id;
}

async function saveGroupMembers(){
  const gid=await ensureCurrentGroupId();
  await api("aa_groups?id=eq."+encodeURIComponent(gid),{
    method:"PATCH",
    headers:{"Prefer":"return=minimal"},
    body:JSON.stringify({members:members(),updated_at:new Date().toISOString()})
  });
}


/* ============ 状态 ============ */
const state = {group:"我的AA群组", pickedParts:null};
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => {const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n;};
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "¥"+n.toLocaleString("zh-CN",{minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = n => "¥"+n.toLocaleString("zh-CN",{maximumFractionDigits:0});
const todayISO = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const group = () => DATA[state.group] || {members:[ME],records:[]};
const members = () => group().members;
const records = () => group().records.slice().sort((a,b)=>b.date.localeCompare(a.date));
const AVATAR_COLORS = ["#1B6B53","#3E6E8F","#C96F2B","#B4482E","#8A5A9E","#5A7D3E","#D05A6E","#2F6F7A"];
function colorOf(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%997; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }

/* ============ 结算算法 ============ */
function settleCalc(recs, mems){
  const paid={}, share={}, partsCnt={};
  mems.forEach(m=>{paid[m]=0; share[m]=0; partsCnt[m]=0;});
  recs.forEach(r=>{
    paid[r.payer] += r.amount;
    const parts = r.parts && r.parts.length ? r.parts : mems;
    const per = r.amount/parts.length;
    parts.forEach(m=>{ share[m]+=per; partsCnt[m]++; });
  });
  const net = mems.map(m=>({
    name:m, paid:Math.round(paid[m]*100)/100, share:Math.round(share[m]*100)/100,
    net:Math.round((paid[m]-share[m])*100)/100, parts:partsCnt[m]
  }));
  const creditors = net.filter(n=>n.net>0.005).map(n=>({...n})).sort((a,b)=>b.net-a.net);
  const debtors = net.filter(n=>n.net<-0.005).map(n=>({...n})).sort((a,b)=>a.net-b.net);
  const transfers=[];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt=Math.round(Math.min(c.net, -d.net)*100)/100;
    transfers.push({from:d.name, to:c.name, amt});
    c.net=Math.round((c.net-amt)*100)/100;
    d.net=Math.round((d.net+amt)*100)/100;
    if(c.net<=0.005) ci++;
    if(d.net>=-0.005) di++;
  }
  return {net, transfers};
}

      state.group=n; state.pickedParts=null; renderAll();
    }catch(e){ console.error(e); toast("新建群组失败"); }
  };

}

function renderKPI(){
  const recs=records(), mems=members();
  const total=recs.reduce((a,r)=>a+r.amount,0);
  const calc=settleCalc(recs,mems);
  const me=calc.net.find(n=>n.name===ME)||{paid:0,share:0,net:0,parts:0};
  $("kpiTotal").textContent=money(total);
  $("kpiCount").textContent=recs.length;
  $("kpiMembers").textContent=mems.length;
  $("kpiPerHead").textContent=money(mems.length?total/mems.length:0);
  $("kpiShare").textContent=money(me.share);
  $("kpiMyParts").textContent=me.parts;
  $("kpiNet").textContent=money(me.net);
  $("kpiNet").style.color = me.net>0 ? "var(--jade)" : (me.net<0 ? "var(--red)" : "");
  $("kpiNetSub").innerHTML = "垫付 <b class='num' id='kpiPaid'>"+money(me.paid)+"</b>" + (me.net>=0 ? " · 别人欠我" : " · 我欠别人");
}

/* ============ 图表 ============ */
let trendChart, donutChart;
function initCharts(){
  trendChart=echarts.init($("trendChart"));
  donutChart=echarts.init($("catChart"));
  window.addEventListener("resize", ()=>{trendChart.resize();donutChart.resize();});
}
function last6Months(m){
  const arr=[]; let y=+m.slice(0,4), mo=+m.slice(5);
  for(let i=0;i<6;i++){ arr.unshift(`${y}-${String(mo).padStart(2,"0")}`); mo--; if(mo===0){mo=12;y--;} }
  return arr;
}
function renderCharts(){
  if(!window.echarts || !trendChart || !donutChart) return;
  const now=new Date(); const cur=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const ms=last6Months(cur);
  const all=group().records;
  const vals=ms.map(m=>all.filter(r=>r.date.slice(0,7)===m).reduce((a,r)=>a+r.amount,0));

/* ============ 智能识别 ============ */
var OCR_CONFIG = {
  workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js",
  langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_sim/4.0.0_best_int"
};
function injectLib(url, cb){
  const s=document.createElement("script");
  s.src=url; s.onload=()=>cb&&cb(true); s.onerror=()=>cb&&cb(false);
  document.head.appendChild(s);
}
function extractAmount(s){
  let m=s.match(/[¥￥]\s*(\d{1,7}(?:\.\d{1,2})?)/); if(m) return +m[1];
  m=s.match(/(\d{1,7}(?:\.\d{1,2})?)\s*元/); if(m) return +m[1];
  m=s.match(/(?:消费|实付|金额|合计|支出|付款|支付|转账|收款|扣款|到账|成功)[^0-9]{0,6}(\d{1,7}(?:\.\d{1,2})?)/); if(m) return +m[1];
  m=s.match(/(?:^|[^\d.])(\d{1,7}\.\d{1,2})(?!\d)/); if(m) return +m[1];
  m=s.match(/^(\d{1,7}(?:\.\d{1,2})?)$/); if(m) return +m[1];
  return null;
}
function extractNote(s){
  return s
    .replace(/[¥￥]\s*\d{1,7}(?:\.\d{1,2})?/g," ")
    .replace(/\d{1,7}(?:\.\d{1,2})?\s*元/g," ")
    .replace(/(20\d{2})[年\/\-.]\d{1,2}[月\/\-.]\d{1,2}日?/g," ")
    .replace(/\d{1,2}月\d{1,2}日/g," ")
    .replace(/\d{1,2}[-\/]\d{1,2}(?!\d)/g," ")
    .replace(/\d+(?:\.\d+)?/g," ")
    .replace(/微信支付|支付宝|已支付|支付成功|付款|收款|商户|商户名|消费|支出|实付|合计|账单/g," ")
    .replace(/[^\u4e00-\u9fa5A-Za-z0-9·&+]/g," ")
    .replace(/\s+/g," ").trim().slice(0,20);
}
function parseFirst(text){
  const lines=text.split(/\n|；|;/).map(s=>s.trim()).filter(Boolean)
    .map(s=>s.replace(/([\u4e00-\u9fa5])\s+(?=[\u4e00-\u9fa5])/g,"$1"));
  for(const ln of lines){
    const amt=extractAmount(ln);
    if(amt!=null) return {amt:Math.round(amt*100)/100, note:extractNote(ln)||"AA消费"};
  }
  return null;
}
function fillFromAi(parsed){
  if(!parsed) return false;
  $("fAmount").value=parsed.amt;
  $("fNote").value=parsed.note;
  const ok=$("aiOk");
  ok.style.display="block";
  ok.innerHTML=`已识别 <b>${money(parsed.amt)}</b>${parsed.note!=="AA消费"?` · ${esc(parsed.note)}`:""}，确认付款人与参与人后保存`;
  updateSplitTip();
  return true;
}
function setStatus(html, show){ const s=$("aiStatus"); s.innerHTML=html; s.style.display=show?"block":"none"; }
let ocrWorker=null, aiTimer=null;
function parseNow(){
  const parsed=parseFirst($("aiInput").value);
  if(!parsed){ $("aiOk").style.display="none"; return; }
  fillFromAi(parsed);
}
$("aiInput").addEventListener("input", ()=>{ clearTimeout(aiTimer); aiTimer=setTimeout(parseNow, 450); });
$("aiParseBtn").onclick=parseNow;
async function ocrFile(file){
  if(!window.Tesseract){
    setStatus('<span class="spinner"></span>正在加载识别组件…', true);
    await new Promise(res=>injectLib("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js", res));
  }
  if(!window.Tesseract){ setStatus("识别组件加载失败（多为网络原因），文字粘贴识别不受影响", true); return ""; }
  const status=$("aiStatus");
  setStatus(`<span class="spinner"></span>正在识别图片文字${ocrWorker?"":"，首次需下载中文识别包（约10MB）"}…`, true);
  try{
    if(!ocrWorker){
      ocrWorker=await Tesseract.createWorker("chi_sim",1,{
        workerPath:OCR_CONFIG.workerPath, corePath:OCR_CONFIG.corePath, langPath:OCR_CONFIG.langPath,
        logger:m=>{ if(m.status==="recognizing text" && status.style.display!=="none") status.innerHTML=`<span class="spinner"></span>识别中 ${Math.round(m.progress*100)}%…`; }
      });
    }
    const {data:{text}}=await ocrWorker.recognize(file);
    setStatus("",false);
    return text;
  }catch(e){
    setStatus(`识别失败：${esc(e.message||e)}`, true);
    return "";
  }
}
function handleImage(file){
  if(!file || !file.type.startsWith("image/")) return;
  $("aiPreviewImg").src=URL.createObjectURL(file);
  $("aiPreviewName").textContent=file.name||"截图";
  $("aiPreview").style.display="flex";
  setStatus('<span class="spinner"></span>正在读取图片…', true);
  ocrFile(file).then(text=>{
    if(!text) return;
    $("aiInput").value=text.trim();
    if(!fillFromAi(parseFirst(text))){ setStatus("未在图片中识别到金额", true); }
  });
}
const ocrZone=$("ocrZone");
["dragover","dragenter"].forEach(ev=>ocrZone.addEventListener(ev,e=>{e.preventDefault();ocrZone.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>ocrZone.addEventListener(ev,e=>{e.preventDefault();ocrZone.classList.remove("drag");}));
ocrZone.addEventListener("drop", e=>handleImage(e.dataTransfer.files[0]));
ocrZone.onclick=()=>$("aiFile").click();
$("aiFile").addEventListener("change", e=>{ handleImage(e.target.files[0]); e.target.value=""; });
$("aiInput").addEventListener("paste", e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith("image/")){ e.preventDefault(); const f=it.getAsFile(); if(f) handleImage(f); return; }
  }
});
$("aiPreviewClear").onclick=()=>{ $("aiPreview").style.display="none"; $("aiPreviewImg").src=""; };

let toastTimer=null;
function toast(msg){
  let t=$("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#262B27;color:#fff;font-size:13.5px;padding:11px 20px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .22s,transform .22s;z-index:99";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  requestAnimationFrame(()=>{ t.style.opacity="1"; t.style.transform="translateX(-50%) translateY(0)"; });
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateX(-50%) translateY(16px)"; },2200);
}
