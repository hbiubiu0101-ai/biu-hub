<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消费智记 · 智能消费统计工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B6B53'/%3E%3Cpath d='M8 16.5h4l2.5-5 3.5 9 2.8-6h4' stroke='%23F7F5EF' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#F6F4EE;            /* 暖纸底 */
  --panel:#FFFFFF;            /* 面板 */
  --line:#E4E0D4;             /* 账本格线 */
  --line-strong:#D5CFBF;
  --ink:#262B27;              /* 墨色主文字 */
  --ink-2:#5C645E;            /* 次级文字 */
  --ink-3:#9AA19A;            /* 弱文字 */
  --jade:#1B6B53;             /* 翡翠绿：结余/主操作 */
  --jade-deep:#13503E;
  --jade-soft:#E3EFEA;
  --amber:#C96F2B;            /* 琥珀橙：支出警示 */
  --amber-soft:#F7EADC;
  --red:#B4482E;
  --red-soft:#F6E4DE;
  --blue:#3E6E8F;
  --blue-soft:#E4EDF3;
  --radius:8px;
  --shadow:0 1px 2px rgba(38,43,39,.05),0 6px 18px rgba(38,43,39,.06);
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
/* 账本格线背景 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(to bottom,transparent 31px,var(--line) 31px,var(--line) 32px,transparent 32px);
  background-size:100% 32px;
  opacity:.28;
}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px 24px 48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:38px;height:38px;border-radius:9px;background:var(--jade);
  display:grid;place-items:center;color:#fff;flex:none;
}
.brand-mark svg{width:20px;height:20px}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.01em}
.brand p{font-size:12px;color:var(--ink-2);margin-top:1px}
.top-actions{display:flex;align-items:center;gap:10px}
.date-chip{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 12px;font-size:13px;color:var(--ink-2);
}
.date-chip svg{width:15px;height:15px;color:var(--jade)}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav button{
  width:28px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;
  cursor:pointer;color:var(--ink-2);display:grid;place-items:center;font-size:14px;
}
.month-nav button:hover{border-color:var(--jade);color:var(--jade)}
.month-nav b{min-width:108px;text-align:center;font-size:14px;font-weight:700}

/* ============ 布局骨架 ============ */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}

/* ============ KPI 概览 ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.jade::before{background:var(--jade)}
.kpi.amber::before{background:var(--amber)}
.kpi.blue::before{background:var(--blue)}
.kpi.red::before{background:var(--red)}
.kpi .k-label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .k-label svg{width:14px;height:14px;color:var(--ink-3)}
.kpi .k-value{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.01em}
.kpi .k-value small{font-size:14px;font-weight:700;color:var(--ink-3);margin-left:3px}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:5px}
.kpi .k-sub .up{color:var(--red)}
.kpi .k-sub .down{color:var(--jade)}
.kpi .k-sub b{font-weight:700}

/* ============ 主列 ============ */
.main-col{display:flex;flex-direction:column;gap:18px;min-width:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.panel-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-head h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--jade)}
.panel-head .hint{font-size:12px;color:var(--ink-3)}
.panel-body{padding:18px}

/* Tab 切换 */
.tabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{
  border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;
  cursor:pointer;color:var(--ink-2);font-family:inherit;font-weight:500;
}
.tabs button.active{background:var(--panel);color:var(--jade);font-weight:700;box-shadow:0 1px 3px rgba(38,43,39,.1)}

/* 图表区 */
.chart-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.chart-box{min-height:300px}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--ink-2);margin-top:6px}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* 明细表 */
.ledger{width:100%;border-collapse:collapse;table-layout:fixed}
.ledger colgroup col:nth-child(1){width:14%}
.ledger colgroup col:nth-child(2){width:20%}
.ledger colgroup col:nth-child(3){width:34%}
.ledger colgroup col:nth-child(4){width:15%}
.ledger colgroup col:nth-child(5){width:17%}
.ledger th{
  text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);
  padding:8px 12px;border-bottom:1px solid var(--line-strong);background:var(--paper);
}
.ledger td{padding:10px 12px;border-bottom:1px dashed var(--line);font-size:13px;vertical-align:middle}
.ledger tr:last-child td{border-bottom:0}
.ledger .cat-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:2px 9px;border-radius:5px;
}
.ledger .amt{font-weight:700;text-align:right}
.ledger .note{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger .date{color:var(--ink-3);font-size:12px}
.ledger .del-btn{
  border:1px solid var(--line);background:var(--panel);border-radius:5px;width:24px;height:24px;
  cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1;display:grid;place-items:center;
}
.ledger .del-btn:hover{border-color:var(--red);color:var(--red)}
.ledger-empty{text-align:center;padding:38px 0;color:var(--ink-3);font-size:13px}

/* ============ 侧栏 ============ */
.side-col{display:flex;flex-direction:column;gap:18px}

/* 快速记账 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select{
  border:1px solid var(--line-strong);border-radius:6px;padding:9px 11px;font-size:14px;
  font-family:inherit;background:#FCFBF7;color:var(--ink);outline:none;width:100%;
}
.field input:focus,.field select:focus{border-color:var(--jade);background:#fff;box-shadow:0 0 0 3px rgba(27,107,83,.12)}
.field input.num{text-align:right}
.cat-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-picker button{
  border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 2px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;
  font-size:11px;color:var(--ink-2);
}
.cat-picker button svg{width:17px;height:17px}
.cat-picker button.active{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep);font-weight:700}
.save-btn{
  grid-column:1/-1;border:0;border-radius:7px;background:var(--jade);color:#fff;
  padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:2px;
}
.save-btn:hover{background:var(--jade-deep)}
.save-btn:active{transform:translateY(1px)}

/* ============ 智能识别 ============ */
.ai-tip{font-size:12px;color:var(--ink-2);background:var(--jade-soft);border:1px solid #CFE2DA;border-radius:7px;padding:9px 11px;margin-bottom:12px;line-height:1.6}
.ai-tip b{color:var(--jade-deep)}
.ai-input{
  width:100%;min-height:88px;resize:vertical;border:1px dashed var(--line-strong);border-radius:8px;
  padding:10px 12px;font-size:13px;font-family:inherit;background:#FCFBF7;color:var(--ink);outline:none;
}
.ai-input:focus{border-color:var(--jade);background:#fff;box-shadow:0 0 0 3px rgba(27,107,83,.12)}
.ai-row{display:flex;gap:8px;margin-top:9px;align-items:stretch}
.ocr-zone{
  flex:1;border:1px dashed var(--line-strong);border-radius:8px;background:#FCFBF7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 8px;cursor:pointer;text-align:center;color:var(--ink-3);font-size:11.5px;min-height:64px;
  transition:border-color .15s,background .15s;
}
.ocr-zone:hover,.ocr-zone.drag{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep)}
.ocr-zone svg{width:18px;height:18px}
.ai-btn{
  border:0;border-radius:8px;background:var(--ink);color:#fff;padding:0 14px;font-size:13px;
  font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.ai-btn:hover{background:#111}
.ai-btn:active{transform:translateY(1px)}
.ai-status{display:none;margin-top:9px;font-size:12px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.ai-status .spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--jade-soft);border-top-color:var(--jade);border-radius:50%;margin-right:7px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-preview{display:none;margin-top:9px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.ai-preview img{max-height:64px;border:1px solid var(--line);border-radius:6px}
.ai-preview .x-btn{border:0;background:var(--paper);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;cursor:pointer;color:var(--ink-3);font-size:12px;line-height:1}
.ai-preview .x-btn:hover{border-color:var(--red);color:var(--red)}
.result-card{border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.result-card .rc-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--paper);padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2);
}
.result-card .rc-head b{color:var(--jade-deep)}
.result-card .rc-actions{display:flex;gap:6px}
.result-card .rc-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 12px}
.result-card .rc-body .field label{font-size:11px}
.result-card .rc-body input,.result-card .rc-body select{padding:7px 9px;font-size:13px}
.rc-add{
  grid-column:1/-1;border:1px solid var(--jade);background:var(--jade-soft);color:var(--jade-deep);
  border-radius:7px;padding:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.rc-add:hover{background:#D5E8E0}
.rc-add-all{
  width:100%;border:0;background:var(--jade);color:#fff;border-radius:7px;padding:10px;
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;
}
.rc-add-all:hover{background:var(--jade-deep)}
.rc-add-all:disabled{background:#C8D4CF;cursor:not-allowed}
.ai-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:6px 0 2px}

/* 预算进度 */
.budget-row{padding:13px 18px;border-bottom:1px dashed var(--line)}
.budget-row:last-child{border-bottom:0}
.budget-row .b-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.budget-row .b-name{font-size:13px;font-weight:700}
.budget-row .b-amt{font-size:12px;color:var(--ink-2)}
.budget-row .b-amt b{color:var(--ink);font-size:13px}
.bar{height:7px;background:#EFECE3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--jade)}
.bar i.warn{background:var(--amber)}
.bar i.over{background:var(--red)}
.budget-total{padding:13px 18px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line-strong);background:var(--paper)}

/* 智能洞察 */
.insight{display:flex;gap:11px;padding:13px 16px;border-bottom:1px dashed var(--line)}
.insight:last-child{border-bottom:0}
.insight .i-ico{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.insight .i-ico svg{width:16px;height:16px}
.insight .i-ico.up{background:var(--red-soft);color:var(--red)}
.insight .i-ico.trend{background:var(--amber-soft);color:var(--amber)}
.insight .i-ico.tip{background:var(--jade-soft);color:var(--jade)}
.insight .i-ico.idea{background:var(--blue-soft);color:var(--blue)}
.insight .i-text{font-size:12.5px;color:var(--ink)}
.insight .i-text b{color:var(--ink);font-weight:700}
.insight .i-text .muted{color:var(--ink-3);font-size:11.5px;margin-top:2px}

/* ============ 响应式 ============ */
@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side-col{display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{padding:14px 14px 40px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-grid{grid-template-columns:1fr}
  .side-col{grid-template-columns:1fr}
  .topbar{flex-direction:column;align-items:flex-start}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k-value{font-size:21px}
  .ledger .note{display:none}
  .ledger colgroup col:nth-child(3){width:0}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .save-btn{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 20 5v14.5M4 19.5h16M7 8.5h4M7 12h4M14 8.5h3M14 12h3"/></svg>
      </div>
      <div>
        <h1>消费智记</h1>
        
      </div>
    </div>
    <div class="top-actions">
      <div class="date-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div class="month-nav">
          <button id="prevMonth" aria-label="上个月">‹</button>
          <b id="monthLabel">2026年10月</b>
          <button id="nextMonth" aria-label="下个月">›</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== KPI 概览 ===== -->
  <section class="kpi-grid" aria-label="本月概览">
    <div class="kpi jade">
      <div class="k-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>本月支出</div>
      <div class="k-value num" id="kpiSpend">¥0.00</div>
      <div class="k-sub" id="kpiSpendSub">较上月 <b class="up" id="kpiSpendDelta">+0.0%</b></div>
    </div>
    <div class="kpi blue">
      <div class="k-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>消费笔数</div>
      <div class="k-value num" id="kpiCount">0</div>
      <div class="k-sub" id="kpiCountSub">日均 <b id="kpiDaily">0</b> 笔</div>
    </div>
    <div class="kpi amber">
      <div class="k-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>日均支出</div>
      <div class="k-value num" id="kpiAvg">¥0.00</div>
      <div class="k-sub">按已过天数折算</div>
    </div>
    <div class="kpi red">
      <div class="k-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>预算剩余</div>
      <div class="k-value num" id="kpiBudget">¥0.00</div>
      <div class="k-sub" id="kpiBudgetSub">本月预算 ¥0</div>
    </div>
  </section>

  <!-- ===== 主体 ===== -->
  <div class="shell">
    <!-- 主列 -->
    <div class="main-col">

      <!-- 图表 -->
      <section class="panel">
        <div class="panel-head">
          <h3><span class="dot"></span>消费分析</h3>
          <div class="tabs">
            <button data-charttab="trend" class="active">支出趋势</button>
            <button data-charttab="cat">分类结构</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="chart-grid">
            <div id="trendChart" class="chart-box"></div>
            <div id="catChart" class="chart-box"></div>
          </div>
        </div>
      </section>

      <!-- 明细 -->
      <section class="panel">
        <div class="panel-head">
          <h3><span class="dot"></span>消费明细</h3>
          <span class="hint">共 <b id="ledgerTotal" class="num">0</b> 笔 · 点击可切换分类筛选</span>
        </div>
        <div class="panel-body" style="padding:0">
          <table class="ledger">
            <colgroup><col><col><col><col><col></colgroup>
            <thead>
              <tr>
                <th>日期</th><th>分类</th><th>备注</th><th style="text-align:right">金额</th><th style="text-align:center">操作</th>
              </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
          </table>
          <div id="ledgerEmpty" class="ledger-empty" style="display:none">本月还没有消费记录，去右侧记一笔吧</div>
        </div>
      </section>
    </div>

    <!-- 侧栏 -->
    <aside class="side-col">

      <!-- 快速记账 -->
      <section class="panel">
        <div class="panel-head"><h3><span class="dot"></span>记一笔</h3><span class="hint">Enter 快速保存</span></div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field full">
              <label>消费金额（元）</label>
              <input type="number" id="fAmount" class="num" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
            </div>
            <div class="field full">
              <label>选择分类</label>
              <div class="cat-picker" id="catPicker"></div>
            </div>
            <div class="field">
              <label>日期</label>

/* ============ 工具 ============ */
const sumBy = (list, fn) => list.reduce((a,r)=>a+fn(r),0);
const money = n => "¥"+n.toLocaleString("zh-CN",{minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = n => "¥"+n.toLocaleString("zh-CN",{maximumFractionDigits:0});
const monthDays = m => new Date(m.slice(0,4), Number(m.slice(5)), 0).getDate();
const elapsedDays = m => m===CUR ? today.getDate() : monthDays(m);
const prevMonth = m => {const d=new Date(m+"-01"); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;};
const nextMonth = m => {const d=new Date(m+"-01"); d.setMonth(d.getMonth()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;};
const monthRecords = m => (DATA[m]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
const monthTotal = m => sumBy(monthRecords(m), r=>r.amt);

/* ============ KPI ============ */
function renderKPI(m){
  const recs = monthRecords(m), total = sumBy(recs, r=>r.amt);
  const days = elapsedDays(m), avg = total/days;
  const prev = prevMonth(m), prevTotal = monthTotal(prev);
  const delta = prevTotal>0 ? (total-prevTotal)/prevTotal*100 : 0;
  const budgetLeft = BUDGET_TOTAL - total;
  $("kpiSpend").textContent = money(total);
  $("kpiSpendDelta").textContent = (delta>=0?"+":"")+delta.toFixed(1)+"%";
  $("kpiSpendDelta").className = delta>0?"up":"down";
  $("kpiCount").textContent = recs.length;
  $("kpiDaily").textContent = (recs.length/days).toFixed(1);
  $("kpiAvg").textContent = money(avg);
  $("kpiBudget").textContent = money(budgetLeft);
  $("kpiBudget").style.color = budgetLeft<0 ? "var(--red)" : "";
  $("kpiBudgetSub").textContent = "本月预算 " + money0(BUDGET_TOTAL);
}

/* ============ 图表 ============ */
let trendChart, catChart;
const chartBase = {
  grid:{left:10,right:12,top:28,bottom:4,containLabel:true},

function initCharts(){

  window.addEventListener("resize", ()=>{trendChart.resize();catChart.resize();});
}
function last6Months(m){
  const arr=[]; let cur=m;
  for(let i=0;i<6;i++){ arr.unshift(cur); cur=prevMonth(cur); }
  return arr;
}
function renderTrend(m){
  const ms = last6Months(m);
  const vals = ms.map(x=>monthTotal(x));
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  trendChart.setOption({
    title:{text:"近 6 个月支出", left:0, top:0, textStyle:{fontSize:13,fontWeight:700,color:"#262B27"}},
    tooltip:{trigger:"axis", formatter:p=>{const i=p[0].dataIndex; return `${ms[i].slice(0,4)}年${Number(ms[i].slice(5))}月<br><b style="color:#1B6B53">${money(vals[i])}</b>`;}},
    xAxis:{type:"category", data:ms.map(x=>Number(x.slice(5))+"月"), axisLine:{lineStyle:{color:"#D5CFBF"}}, axisTick:{show:false}},
    yAxis:{type:"value", axisLabel:{formatter:v=>"¥"+v}, splitLine:{lineStyle:{color:"#EFECE3"}}},
    series:[
      {type:"bar", data:vals, barWidth:"46%", itemStyle:{color:p=>p.dataIndex===5?"#1B6B53":"#C9D8D2", borderRadius:[4,4,0,0]}, label:{show:true, position:"top", formatter:p=>money0(p.value), fontSize:10.5, color:"#5C645E"}},
      {type:"line", data:vals.map(()=>avg), symbol:"none", lineStyle:{type:"dashed", color:"#B4482E", width:1.5}, label:{show:false}}
    ]
  }, true);
}
function renderCatBar(m){
  const by = catSummary(m);
  const sorted = [...by].sort((a,b)=>b.amt-a.amt);
  catChart.setOption({
    title:{text:"分类支出排序", left:0, top:0, textStyle:{fontSize:13,fontWeight:700,color:"#262B27"}},
    tooltip:{trigger:"axis", axisPointer:{type:"shadow"}, formatter:p=>{const d=p[0]; return `${d.name}<br><b style="color:${d.color}">${money(d.value)}</b>`;}},
    grid:{left:10,right:30,top:28,bottom:4,containLabel:true},
    xAxis:{type:"value", axisLabel:{formatter:"¥"}, splitLine:{lineStyle:{color:"#EFECE3"}}},
    yAxis:{type:"category", data:sorted.map(x=>x.key), axisLine:{lineStyle:{color:"#D5CFBF"}}, axisTick:{show:false}},
    series:[{type:"bar", data:sorted.map(x=>({value:x.amt, itemStyle:{color:x.color, borderRadius:[0,4,4,0]}})), barWidth:"58%", label:{show:true, position:"right", formatter:p=>money0(p.value), fontSize:10.5, color:"#5C645E"}}]
  }, true);
}
function renderDonut(m){
  const by = catSummary(m).sort((a,b)=>b.amt-a.amt);
  catChart.setOption({
    title:{text:"本月分类占比", left:0, top:0, textStyle:{fontSize:13,fontWeight:700,color:"#262B27"}},
    tooltip:{trigger:"item", formatter:p=>`${p.name}<br><b style="color:${p.color}">${money(p.value)}</b>（${p.percent}%）`},
    legend:{bottom:0, icon:"circle", itemWidth:8, itemHeight:8, textStyle:{fontSize:11,color:"#5C645E"}},
    series:[{
      type:"pie", radius:["52%","72%"], center:["50%","45%"], avoidLabelOverlap:true,
      itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:3},
      label:{show:true, formatter:"{d}%", fontSize:11, color:"#5C645E"},
      emphasis:{scaleSize:4},
      data: by.length ? by.map(x=>({name:x.key, value:x.amt, itemStyle:{color:x.color}})) : [{name:"暂无", value:1, itemStyle:{color:"#E4E0D4"}}]
    }]

  catChart.off("click");
  catChart.on("click", p=>{ if(!p.name) return; state.catFilter = state.catFilter===p.name ? null : p.name; renderLedger(state.month); renderDonut(m); });
}
function catSummary(m){
  const map={}; monthRecords(m).forEach(r=>{map[r.cat]=(map[r.cat]||0)+r.amt;});
  return Object.keys(map).map(k=>({key:k, amt:map[k], color:catOf(k).color}));
}
function renderCharts(m){
  if(!window.echarts || !trendChart || !catChart) return;
  if(state.chartTab==="trend"){ renderTrend(m); renderDonut(m); }
  else{ renderCatBar(m); renderDonut(m); }

/* ============ 预算 ============ */
function renderBudget(m){
  const box = $("budgetList"); box.innerHTML="";
  const spentMap={}; monthRecords(m).forEach(r=>{spentMap[r.cat]=(spentMap[r.cat]||0)+r.amt;});
  let totalUsed=0;
  CATS.forEach(c=>{
    const limit = BUDGET[c.key]||0, used = spentMap[c.key]||0; totalUsed+=used;
    const pct = limit>0 ? used/limit*100 : 0;
    const cls = pct>100?"over":(pct>=85?"warn":"");
    const row = el("div","budget-row");
    row.innerHTML = `<div class="b-top"><span class="b-name">${c.key}</span><span class="b-amt"><b class="num">${money0(used)}</b> / ${money0(limit)}</span></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(pct,100)}%"></i></div>`;
    box.appendChild(row);
  });
  const pct = BUDGET_TOTAL>0 ? totalUsed/BUDGET_TOTAL*100 : 0;
  $("budgetTotalPct").textContent = pct.toFixed(0)+"%";
  $("budgetTotalPct").style.color = pct>100?"var(--red)":(pct>=85?"var(--amber)":"");
}

/* ============ 智能洞察 ============ */
function buildInsights(m){
  const recs = monthRecords(m);
  const out = [];
  if(!recs.length) return out;
  const total = sumBy(recs, r=>r.amt);
  const by = catSummary(m).sort((a,b)=>b.amt-a.amt);
  const prev = prevMonth(m), prevTotal = monthTotal(prev);

  // 1. 最大支出分类
  const top = by[0];
  out.push({type:"up", title:`${top.key}是本月最大支出，共 ${money0(top.amt)}`, desc:`占本月总支出 ${(top.amt/total*100).toFixed(1)}%`, icon:"<path d='M12 19V5M5 12l7-7 7 7'/>"});

  // 2. 环比
  if(prevTotal>0){
    const d = (total-prevTotal)/prevTotal*100;
    out.push({type:"trend", title:`本月支出较上月${d>=0?"增加":"减少"} ${Math.abs(d).toFixed(1)}%`, desc:`上月 ${money(prevTotal)} → 本月 ${money(total)}`, icon:"<path d='M3 17l6-6 4 4 7-8'/><path d='M17 7h3v3'/>"});
  }

  // 3. 超预算预警
  const spentMap={}; recs.forEach(r=>{spentMap[r.cat]=(spentMap[r.cat]||0)+r.amt;});
  const over = CATS.filter(c=>BUDGET[c.key] && (spentMap[c.key]||0)/BUDGET[c.key]>=0.85)
    .sort((a,b)=>(spentMap[b.key]/BUDGET[b.key])-(spentMap[a.key]/BUDGET[a.key]));
  if(over.length){
    const o = over[0];
    out.push({type:"tip", title:`${o.key}预算进度已达 ${Math.round((spentMap[o.key]||0)/BUDGET[o.key]*100)}%`, desc: (spentMap[o.key]||0)>BUDGET[o.key] ? `已超出 ${money0((spentMap[o.key]||0)-BUDGET[o.key])}` : `距上限还剩 ${money0(BUDGET[o.key]-(spentMap[o.key]||0))}`, icon:"<circle cx='12' cy='12' r='9'/><path d='M12 8v5M12 16.5h.01'/>"});
  }

  // 4. 高频分类
  const freqMap={}; recs.forEach(r=>{freqMap[r.cat]=(freqMap[r.cat]||0)+1;});
  const freqTop = Object.keys(freqMap).sort((a,b)=>freqMap[b]-freqMap[a])[0];
  if(freqTop && freqMap[freqTop]>=3){
    out.push({type:"idea", title:`${freqTop}消费了 ${freqMap[freqTop]} 笔，频率最高`, desc:"可考虑设置单笔预算或集中采购", icon:"<path d='M9 18h6M10 21h4M12 3a6 6 0 0 1 3.5 10.9c-.6.5-1 1.2-1 2h-5c0-.8-.4-1.5-1-2A6 6 0 0 1 12 3z'/>"});
  }

  // 5. 大额单笔
  const avg = total/elapsedDays(m);
  const big = recs.filter(r=>r.amt>avg*2 && r.amt>=200).sort((a,b)=>b.amt-a.amt)[0];
  if(big){
    out.push({type:"up", title:`单笔大额：${big.note||big.cat} ${money(big.amt)}`, desc:`${big.date.slice(5)} 的支出约为日均（${money(avg)}）的 ${(big.amt/avg).toFixed(1)} 倍`, icon:"<path d='M12 19V5M5 12l7-7 7 7'/>"});
  }
  return out.slice(0,5);
}

/* ============ 智能识别（文字解析 + 图片 OCR） ============ */
const CAT_RULES = [
  {cat:"餐饮", keys:["外卖","美团","饿了么","奶茶","咖啡","早餐","午餐","晚餐","火锅","烧烤","汉堡","面馆","饭店","餐厅","小吃","甜品","水果","麦当劳","肯德基","星巴克","瑞幸","茶百道","蜜雪","聚餐","买菜","零食","面包","食堂","点心"]},
  {cat:"交通", keys:["地铁","公交","滴滴","打车","出租车","网约车","加油","停车","高铁","火车","机票","出行","etc","高速","单车","航旅","车费"]},
  {cat:"购物", keys:["淘宝","天猫","京东","拼多多","超市","便利店","商场","购物","衣服","鞋","外套","快递","日用","唯品会","山姆","沃尔玛","永辉","屈臣氏","无印","名创","优衣库","商城","百货","严选"]},
  {cat:"居住", keys:["房租","房贷","水费","电费","燃气","物业","供暖","维修","宽带","家居","门锁"]},
  {cat:"娱乐", keys:["电影","ktv","游戏","会员","视频","音乐","剧本杀","景区","门票","旅游","酒店","b站","爱奇艺","腾讯视频","steam","网吧","演出","展览","娱乐"]},
  {cat:"医疗", keys:["医院","挂号","门诊","体检","诊所","药店","药品","感冒药","退烧药"]},
  {cat:"教育", keys:["课程","培训","学费","教材","书店","买书","图书馆","文具"]}
];
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function injectLib(url, cb){
  const s = document.createElement("script");
  s.src = url;
  s.onload = ()=>cb && cb(true);
  s.onerror = ()=>cb && cb(false);
  document.head.appendChild(s);
}

function extractAmount(s){
  let m = s.match(/[¥￥]\s*(\d{1,7}(?:\.\d{1,2})?)/);
  if(m) return +m[1];
  m = s.match(/(\d{1,7}(?:\.\d{1,2})?)\s*元/);
  if(m) return +m[1];
  m = s.match(/(?:消费|实付|金额|合计|支出|付款|支付|转账|收款|扣款|到账|成功)[^0-9]{0,6}(\d{1,7}(?:\.\d{1,2})?)/);
  if(m) return +m[1];
  m = s.match(/(?:^|[^\d.])(\d{1,7}\.\d{1,2})(?!\d)/);
  if(m) return +m[1];
  m = s.match(/^(\d{1,7}(?:\.\d{1,2})?)$/);
  if(m) return +m[1];
  return null;
}
function extractDate(s){
  let m = s.match(/(20\d{2})[年\/\-.](\d{1,2})[月\/\-.](\d{1,2})日?/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  m = s.match(/(\d{1,2})月(\d{1,2})日/);
  if(m){ const y=new Date().getFullYear(); return `${y}-${String(+m[1]).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`; }
  m = s.match(/(\d{1,2})[-\/](\d{1,2})(?!\d)/);
  if(m){ const y=new Date().getFullYear(); return `${y}-${String(+m[1]).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`; }
  return null;
}
function classify(s){
  const t = s.toLowerCase();
  for(const r of CAT_RULES) if(r.keys.some(k=>t.includes(k))) return r.cat;
  return "其他";
}
function detectPay(s){
  if(/微信/.test(s)) return "微信";
  if(/支付宝|花呗/.test(s)) return "支付宝";
  if(/招商|工商|建设|农业|中国银行|银行卡|信用卡|银联|储蓄卡/.test(s)) return "银行卡";
  if(/现金/.test(s)) return "现金";
  return null;
}
function extractNote(s){
  return s
    .replace(/[¥￥]\s*\d{1,7}(?:\.\d{1,2})?/g," ")
    .replace(/\d{1,7}(?:\.\d{1,2})?\s*元/g," ")
    .replace(/(20\d{2})[年\/\-.]\d{1,2}[月\/\-.]\d{1,2}日?/g," ")
    .replace(/\d{1,2}月\d{1,2}日/g," ")
    .replace(/\d{1,2}[-\/]\d{1,2}(?!\d)/g," ")
    .replace(/\d+(?:\.\d+)?/g," ")
    .replace(/微信支付|支付宝|已支付|支付成功|付款|收款|商户|商户名|消费|支出|实付|合计|账单/g," ")
    .replace(/[^\u4e00-\u9fa5A-Za-z0-9·&+]/g," ")
    .replace(/\s+/g," ").trim().slice(0,20);
}
const isPayPhrase = s => /^(微信支付|支付宝|已支付|支付成功|付款|收款|账单|交易成功|支付方式|商户|订单号)$/.test(s);
function parseConsume(text, ocrMode){
  let lines = text.split(/\n|；|;/).map(s=>s.trim()).filter(Boolean);
  if(ocrMode){
    lines = lines.map(s=>s.replace(/([\u4e00-\u9fa5])\s+(?=[\u4e00-\u9fa5])/g,"$1"));
    const out=[];
    for(let i=0;i<lines.length;i++){
      const amt = extractAmount(lines[i]);
      if(amt==null) continue;
      let note="";
      for(let j=i-1;j>=0 && !note;j--){
        const t = lines[j];
        if(extractAmount(t)!=null) break;
        if(extractDate(t)!=null || isPayPhrase(t)) continue;
        note = t;
      }
      let date = extractDate(lines[i]);
      if(!date){ for(let j=i+1;j<lines.length && !date;j++) date = extractDate(lines[j]); }
      if(!date){ for(let j=i-1;j>=0 && !date;j--) date = extractDate(lines[j]); }
      out.push({
        amt: Math.round(amt*100)/100,
        cat: classify(lines[i]+" "+note),
        date: date || defaultDate(state.month),
        pay: detectPay(lines[i]) || $("fPay").value,
        note: extractNote(note) || extractNote(lines[i]) || "智能识别消费"
      });
    }
    return dedupeRecords(out);
  }
  const segs = lines;
  const out=[];
  segs.forEach(seg=>{
    const parts = (seg.split(/[，,、]/).map(s=>s.trim()).filter(Boolean).length>1)
      ? seg.split(/[，,、]/).map(s=>s.trim()).filter(Boolean) : [seg];
    parts.forEach(part=>{
      const amt = extractAmount(part);
      if(amt==null) return;
      out.push({
        amt: Math.round(amt*100)/100,
        cat: classify(part),
        date: extractDate(part) || defaultDate(state.month),
        pay: detectPay(part) || $("fPay").value,
        note: extractNote(part) || "智能识别消费"
      });
    });
  });
  return dedupeRecords(out);
}
function dedupeRecords(arr){
  const seen=new Set();
  return arr.filter(r=>{ const k=r.amt+"|"+r.cat+"|"+r.date+"|"+r.note; if(seen.has(k))return false; seen.add(k); return true; });
}

let aiResults = [], ocrWorker = null, aiTimer = null;
var OCR_CONFIG = {
  workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js",
  langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_sim/4.0.0_best_int"
};
function setStatus(html, show){ const s=$("aiStatus"); s.innerHTML=html; s.style.display=show?"block":"none"; }
function parseNow(){
  const text = $("aiInput").value;
  const box = $("aiResults");
  if(!text.trim()){ box.innerHTML='<div class="ai-empty">把账单文字或截图丢进来，我帮你识别入账</div>'; aiResults=[]; return; }
  aiResults = parseConsume(text);
  renderAiResults();
}
function renderAiResults(){
  const box = $("aiResults");
  if(!aiResults.length){
    box.innerHTML='<div class="ai-empty">没有识别到金额信息，试试包含「¥金额」或「xx元」的账单文字</div>';
    return;
  }
  box.innerHTML="";
  aiResults.forEach((r,i)=>{
    const card = el("div","result-card");
    card.innerHTML = `
      <div class="rc-head"><span>第 ${i+1} 笔 · <b class="num">${money(r.amt)}</b> · <b>${r.cat}</b></span><span class="rc-actions"><button class="rc-del" data-i="${i}">忽略</button></span></div>
      <div class="rc-body">
        <div class="field"><label>金额（元）</label><input class="num rc-amt" data-i="${i}" type="number" min="0" step="0.01" value="${r.amt}"></div>
        <div class="field"><label>分类</label><select class="rc-cat" data-i="${i}">${CATS.map(c=>`<option ${c.key===r.cat?"selected":""}>${c.key}</option>`).join("")}</select></div>
        <div class="field"><label>日期</label><input class="rc-date" data-i="${i}" type="date" value="${r.date}"></div>
        <div class="field"><label>付款方式</label><select class="rc-pay" data-i="${i}">${["微信","支付宝","银行卡","现金","信用卡"].map(p=>`<option ${p===r.pay?"selected":""}>${p}</option>`).join("")}</select></div>
        <div class="field full"><label>备注</label><input class="rc-note" data-i="${i}" type="text" value="${esc(r.note)}"></div>
        <button class="rc-add" data-i="${i}">加入账本</button>
      </div>`;
    box.appendChild(card);
  });
  const allBtn = el("button","rc-add-all", `全部加入（${aiResults.length} 笔）`);
  allBtn.onclick = ()=>{
    [...aiResults.keys()].forEach(i=>addAi(i));
    aiResults=[]; $("aiInput").value=""; renderAiResults(); flashSave("已全部识别并入账");
  };
  box.appendChild(allBtn);
  box.querySelectorAll(".rc-del").forEach(b=>b.onclick=()=>{
    aiResults.splice(+b.dataset.i,1); renderAiResults();
  });
  box.querySelectorAll(".rc-add").forEach(b=>b.onclick=()=>{
    addAi(+b.dataset.i); aiResults.splice(+b.dataset.i,1); renderAiResults(); flashSave("已识别并入账");
  });
}
function addAi(i){
  const card = $("aiResults").querySelectorAll(".result-card")[i];
  const amt = parseFloat(card.querySelector(".rc-amt").value);
  const date = card.querySelector(".rc-date").value;
  if(!amt || amt<=0 || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  const rec = {
    amt: Math.round(amt*100)/100,
    cat: card.querySelector(".rc-cat").value,
    date,
    pay: card.querySelector(".rc-pay").value,
    note: card.querySelector(".rc-note").value.trim() || "智能识别消费"
  };
  const m = date.slice(0,7);
  (DATA[m]=DATA[m]||[]).push(rec);
  state.month = m;
  renderAll();
}
async function ocrFile(file){
  if(!window.Tesseract){
    setStatus('<span class="spinner"></span>正在加载识别组件…', true);
    await new Promise(res=>injectLib("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js", res));
  }
  if(!window.Tesseract){ setStatus("识别组件加载失败（多为网络原因），文字粘贴识别不受影响，请稍后刷新页面重试", true); return ""; }
  const status = $("aiStatus");
  setStatus(`<span class="spinner"></span>正在识别图片文字${ocrWorker?"":"，首次需下载中文识别包（约10MB）"}…`, true);
  try{
    if(!ocrWorker){
      ocrWorker = await Tesseract.createWorker("chi_sim", 1, {
        workerPath: OCR_CONFIG.workerPath,
        corePath: OCR_CONFIG.corePath,
        langPath: OCR_CONFIG.langPath,
        logger: m=>{ if(m.status==="recognizing text" && status.style.display!=="none") status.innerHTML=`<span class="spinner"></span>识别中 ${Math.round(m.progress*100)}%…`; }
      });
    }
    const {data:{text}} = await ocrWorker.recognize(file);
    setStatus("", false);
    return text;
  }catch(e){
    setStatus(`识别失败：${esc(e.message||e)}`, true);
    return "";
  }
}
function handleImage(file){
  if(!file || !file.type.startsWith("image/")) return;
  $("aiPreviewImg").src = URL.createObjectURL(file);
  $("aiPreviewName").textContent = file.name || "截图";
  $("aiPreview").style.display = "flex";
  setStatus('<span class="spinner"></span>正在读取图片…', true);
  ocrFile(file).then(text=>{
    if(!text) return;
    $("aiInput").value = text.trim();
    aiResults = parseConsume(text, true);
    renderAiResults();
  });
}
/* 识别区事件 */
$("aiInput").addEventListener("input", ()=>{ clearTimeout(aiTimer); aiTimer=setTimeout(parseNow, 450); });
$("aiParseBtn").onclick = parseNow;
const ocrZone = $("ocrZone");
["dragover","dragenter"].forEach(ev=>ocrZone.addEventListener(ev,e=>{e.preventDefault();ocrZone.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>ocrZone.addEventListener(ev,e=>{e.preventDefault();ocrZone.classList.remove("drag");}));
ocrZone.addEventListener("drop", e=>{ handleImage(e.dataTransfer.files[0]); });
ocrZone.onclick = ()=>$("aiFile").click();
$("aiFile").addEventListener("change", e=>{ handleImage(e.target.files[0]); e.target.value=""; });
$("aiInput").addEventListener("paste", e=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith("image/")){ e.preventDefault(); const f=it.getAsFile(); if(f) handleImage(f); return; }
  }
});
$("aiPreviewClear").onclick = ()=>{ $("aiPreview").style.display="none"; $("aiPreviewImg").src=""; };

/* ============ 记账 ============ */
function defaultDate(m){
  if(m===CUR) return today.toISOString().slice(0,10);
  return m+"-01";
}
function saveRecord(){
  const amt = parseFloat($("fAmount").value);
  if(!amt || amt<=0){ $("fAmount").focus(); flashSave("请输入有效金额", true); return; }
  const date = $("fDate").value || defaultDate(state.month);
  if(!date.startsWith(state.month)){ flashSave("日期需在当前查看的月份内", true); return; }
  const rec = {date, cat:pickedCat, note:$("fNote").value.trim(), amt:Math.round(amt*100)/100, pay:$("fPay").value};
  (DATA[state.month] = DATA[state.month]||[]).push(rec);
  $("fAmount").value=""; $("fNote").value="";
  renderAll();
  flashSave("已记入这笔消费");
}
function flashSave(msg, err){
  const btn = $("saveBtn");
  btn.textContent = msg;
  btn.style.background = err ? "var(--red)" : "var(--jade-deep)";
  setTimeout(()=>{ btn.textContent = "保存这笔消费"; btn.style.background = ""; }, 1400);
}
